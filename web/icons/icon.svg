<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)" />
  <g filter="url(#shadow)" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Center splitter node -->
    <circle cx="256" cy="256" r="44" fill="#ffffff" stroke="none" />
    <!-- Incoming payment flow from top left -->
    <path d="M 120 120 L 220 220" />
    <!-- Incoming payment flow from bottom left -->
    <path d="M 120 392 L 220 292" />
    <!-- Minimal outgoing transfer flow to right -->
    <path d="M 292 256 L 392 256" />
    <!-- Arrowhead to right -->
    <path d="M 364 228 L 396 256 L 364 284" />
  </g>
  <!-- Node dots -->
  <circle cx="120" cy="120" r="24" fill="#ffffff" />
  <circle cx="120" cy="392" r="24" fill="#ffffff" />
  <circle cx="392" cy="256" r="24" fill="#ffffff" />
</svg>
